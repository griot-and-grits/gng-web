name: E2E Tests

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout gng-web
        uses: actions/checkout@v4

      - name: Checkout gng-backend
        uses: actions/checkout@v4
        with:
          repository: griot-and-grits/gng-backend
          path: gng-backend

      - name: Checkout rh-hackathon
        uses: actions/checkout@v4
        with:
          repository: griot-and-grits/rh-hackathon
          path: rh-hackathon

      - name: Start test services
        run: |
          docker compose -f rh-hackathon/docker-compose.test.yml up -d --build --wait
        env:
          BACKEND_PATH: ./gng-backend
          FRONTEND_PATH: .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: 'true'
          BACKEND_URL: http://localhost:8000

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker compose -f rh-hackathon/docker-compose.test.yml down -v
